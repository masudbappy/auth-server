server:
  port: 9090

spring:
  application:
    name: auth-server
  datasource:
    url: jdbc:postgresql://localhost:5433/auth-server
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090

jwt:
  secret: mySecretKeyForInventoryManagementSystemAuthServerWithLongerKeyForBetterSecurity
  expiration: 86400000 # 24 hours

cors:
  allowed-origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true